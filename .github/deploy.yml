name: 🚀 Deploy to FTP

on:
  push:
    branches:
      - main   # прод
      - dev    # стейджинг

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: 🚀 Deploy

    # main -> PROD, dev -> STAGING (один FTP, разный только путь)
    env:
      ENV_NAME: ${{ github.ref_name == 'main' && 'PROD' || 'STAGING' }}
      SERVER_DIR: ${{ github.ref_name == 'main' && secrets.THEME_PATH || secrets.DEV_THEME_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install terser postcss postcss-nesting cssnano

      - name: Minify CSS and JS
        run: node minify.js

      - name: Notify Slack (start)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          payload=$(printf '{"text":"🟡 DEPLOY NewBornStyle started (%s)\nRepo: %s\nBranch: %s"}' \
            "$ENV_NAME" "${{ github.repository }}" "${{ github.ref_name }}")
          curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          protocol: ftp
          port: ${{ secrets.PORT }}
          server-dir: ${{ env.SERVER_DIR }}
          # инкрементальная заливка: только изменённые файлы
          # по хешам в .ftp-deploy-sync-state.json на сервере
          dangerous-clean-slate: false
          exclude: |
            **/node_modules/**
            **/.git/**
            **/.github/**
            package.json
            package-lock.json

      - name: Notify Slack (result)
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          status="🟡 UNKNOWN"
          [ "${{ job.status }}" = "success" ] && status="🟢 SUCCESS"
          [ "${{ job.status }}" = "failure" ] && status="🔴 FAILED"
          payload=$(printf '{"text":"DEPLOY NewBornStyle %s (%s)\nRepo: %s\nBranch: %s"}' \
            "$status" "$ENV_NAME" "${{ github.repository }}" "${{ github.ref_name }}")
          curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"



name: 🚀 Deploy to FTP

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [ closed ]
    branches:
      - main
      - dev

jobs:
  sftp-deploy:
    if: github.event_name == 'push' || (github.event.pull_request.merged == true)
    name: Upload via FTP
    runs-on: ubuntu-latest

    env:
      SERVER_DIR: >-
        ${{
          github.ref_name == 'main'
            && secrets.THEME_PATH
            || secrets.DEV_THEME_PATH
        }}
      ENV_NAME: >-
        ${{
          github.ref_name == 'main'
            && 'PROD'
            || 'DEV'
        }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Notify Slack (start)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -e
          payload=$(printf '{"text":"🟡 DEPLOY NewBornStyle started (%s)\nRepo: %s\nBranch: %s"}' \
            "$ENV_NAME" "${{ github.repository }}" "${{ github.ref_name }}")

          curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install terser postcss postcss-nesting cssnano

      - name: Minify CSS and JS
        run: node minify.js

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          protocol: ftp
          port: ${{ secrets.PORT }}
          server-dir: ${{ env.SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/node_modules/**
            **/.git/**
            **/.github/**
            package.json
            package-lock.json

      - name: Notify Slack (success)
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -e
          payload=$(printf '{"text":"🟢 DEPLOY NewBornStyle SUCCESS (%s)\nRepo: %s\nBranch: %s"}' \
            "$ENV_NAME" "${{ github.repository }}" "${{ github.ref_name }}")

          curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"

      - name: Notify Slack (failure)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -e
          payload=$(printf '{"text":"🔴 DEPLOY NewBornStyle FAILED (%s)\nRepo: %s\nBranch: %s"}' \
            "$ENV_NAME" "${{ github.repository }}" "${{ github.ref_name }}")

          curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
